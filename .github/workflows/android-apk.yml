name: Android APK

# Builds an installable APK of Bluemoon Site on GitHub's Linux machines, so nothing has to be
# built on a Windows PC (its 260-character path limit breaks the Android build there).
# It starts when you press "Run workflow" in the Actions tab, or when a tag named apk-* is pushed.
# Download the APK from the finished run: Actions > Android APK > the run > Artifacts.
# The APK is signed with the standard Android debug key. That is fine for testing on your own
# phones. Sign the final handover build with your own release key (see docs/OWNER-GUIDE.md).
#
# When the run ends it also pushes the result (status, the error excerpt if it failed, and the
# APK) to a branch called ci-result, so the developer can read it without opening GitHub.
# That branch is replaced on every run and can be deleted at any time.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU types to build (arm64-v8a covers almost every phone made since 2017)'
        default: 'arm64-v8a'
  push:
    tags: ['apk-*']

concurrency:
  group: android-apk
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packages
        id: install
        run: npm ci --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Prepare the Android SDK
        id: sdk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SDKM" --licenses > /dev/null) || true
          # React Native 0.88 builds against API 37 with NDK 27.1; Gradle fetches them if this fails.
          ("$SDKM" "platforms;android-37" "ndk;27.1.12297006" > /dev/null) || true

      - name: Generate the Android project
        id: prebuild
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Tune Gradle for a test build
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "android.enableMinifyInReleaseBuilds=false"
            echo "android.enableShrinkResourcesInReleaseBuilds=false"
          } >> android/gradle.properties

      - name: Show how Gradle starts the inline-modules step
        continue-on-error: true
        working-directory: android
        run: |
          node --version
          ./gradlew :expo:generateInlineModules --info --console=plain 2>&1 | grep -E "Command: node|Working directory|autolinking failed|SyntaxError" | head -20 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build the release APK
        id: gradle
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures="$ABIS" "-Pexpo.inlineModules.watchedDirectories=[]" --console=plain --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Bluemoon-Site-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Bluemoon-Site-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish the result to the ci-result branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          OUTCOMES: 'install=${{ steps.install.outcome }} sdk=${{ steps.sdk.outcome }} prebuild=${{ steps.prebuild.outcome }} gradle=${{ steps.gradle.outcome }}'
          JOB: ${{ job.status }}
        run: |
          set +e
          out="$RUNNER_TEMP/result"; rm -rf "$out"; mkdir -p "$out"
          {
            echo "job: $JOB"
            echo "steps: $OUTCOMES"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "finished: $(date -u +%FT%TZ)"
          } > "$out/status.txt"
          tail -n 400 "$RUNNER_TEMP/build.log" > "$out/build-tail.txt" 2>/dev/null
          grep -nE "FAILURE|What went wrong|error:|ERROR|Exception" -A6 "$RUNNER_TEMP/build.log" 2>/dev/null | head -150 > "$out/errors.txt"
          apk=$(ls dist/*.apk 2>/dev/null | head -1)
          if [ -n "$apk" ] && [ "$(stat -c%s "$apk")" -lt 95000000 ]; then cp "$apk" "$out/"; fi
          cd "$out" || exit 0
          git init -q -b ci-result
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build result for run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-result
          exit 0
